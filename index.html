<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placar Comercial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>🏆 Placar Comercial</h1>

<div class="cards">

<div class="card">
<h3>🎯 Meta</h3>
<p id="meta">R$ 250.000</p>
</div>

<div class="card">
<h3>💰 Vendido</h3>
<p id="vendido">R$ 0</p>
</div>

<div class="card">
<h3>🚀 Falta</h3>
<p id="falta">R$ 0</p>
</div>

<div class="card">
<h3>📈 Atingido</h3>
<p id="percentual">0%</p>
</div>

</div>

<div class="progress">
<div id="barra"></div>
</div>

<h2>🏅 Ranking</h2>

<div id="ranking"></div>

<h2>📅 Vendas por Dia</h2>

<div id="tabela"></div>

</div>

<script src="app.js"></script>

</body>
</html>
